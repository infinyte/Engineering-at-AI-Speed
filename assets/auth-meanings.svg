<svg xmlns="http://www.w3.org/2000/svg" width="420" height="470" viewBox="0 0 420 470" role="img" aria-labelledby="title desc">
  <title id="title">What can auth mean?</title>
  <desc id="desc">Auth can refer to authentication, abbreviated AuthN, which establishes identity; authorization, abbreviated AuthZ, which decides permitted actions; or ambiguous shorthand for either or both. The last branch is a wording ambiguity, not a separate security operation.</desc>
  <rect width="420" height="470" rx="8" fill="#172235"/>
  <g fill="none" stroke="#bdc8d8" stroke-width="2"><path d="M210 80V100H24V395H48M24 175H48M24 285H48"/></g>
  <g fill="#24364e" stroke-width="1.5"><rect x="20" y="20" width="380" height="60" rx="6" stroke="#bdc8d8"/><rect x="48" y="125" width="352" height="100" rx="6" stroke="#60a5fa"/><rect x="48" y="235" width="352" height="100" rx="6" stroke="#5eead4"/><rect x="48" y="345" width="352" height="100" rx="6" stroke="#fbbf24"/></g>
  <g font-family="Segoe UI,Arial,sans-serif"><text x="210" y="59" text-anchor="middle" fill="#f3f4f6" font-size="26" font-weight="600">Auth</text><g font-size="21" font-weight="600"><text x="68" y="157" fill="#60a5fa">Authentication · AuthN</text><text x="68" y="267" fill="#5eead4">Authorization · AuthZ</text><text x="68" y="377" fill="#fbbf24">Ambiguous shorthand</text></g><g fill="#f3f4f6" font-size="17"><text x="68" y="185">Establish the caller's identity.</text><text x="68" y="209">Who is making the request?</text><text x="68" y="295">Decide permitted actions.</text><text x="68" y="319">May this caller do this?</text><text x="68" y="405">Either, both, or a broader scope.</text><text x="68" y="429">Clarify what “auth” includes.</text></g></g>
</svg>
