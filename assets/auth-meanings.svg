<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc"><title id="title">What can auth mean?</title><desc id="desc">Auth can refer to authentication, abbreviated AuthN, which establishes identity; authorization, abbreviated AuthZ, which decides permitted actions; or ambiguous shorthand for either or both. The last branch is a wording ambiguity, not a separate security operation.</desc><rect width="800" height="350" rx="8" fill="#172235"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="305" y="20" width="190" height="75" rx="6" fill="#24364e" stroke="#bdc8d8"/><rect x="30" y="150" width="224" height="100" rx="6" fill="#24364e" stroke="#60a5fa"/><rect x="288" y="150" width="224" height="100" rx="6" fill="#24364e" stroke="#5eead4"/><rect x="546" y="150" width="224" height="100" rx="6" fill="#24364e" stroke="#fbbf24"/><g fill="#f3f4f6" font-size="24"><text x="400" y="53">Auth</text><text x="142" y="182">Authentication</text><text x="400" y="182">Authorization</text><text x="658" y="182">Ambiguous</text></g><g fill="#bdc8d8" font-size="16"><text x="400" y="79">What can it mean?</text><text x="142" y="210">AuthN: establish identity.</text><text x="142" y="232">Who is making the request?</text><text x="400" y="210">AuthZ: permitted actions.</text><text x="400" y="232">May this caller do this?</text><text x="658" y="210">Either, both, or broader.</text><text x="658" y="232">Clarify the scope.</text><text x="400" y="309">Say AuthN or AuthZ: bare “auth” leaves the scope unclear.</text></g></g><g stroke="#bdc8d8" stroke-width="2" fill="none"><path d="M400 97V120M142 120H658M142 120V142L135 133M142 142L149 133M400 120V142L393 133M400 142L407 133M658 120V142L651 133M658 142L665 133"/></g></svg>
