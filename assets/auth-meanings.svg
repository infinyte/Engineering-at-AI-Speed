<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc">
  <title id="title">What can auth mean?</title>
  <desc id="desc">Auth can refer to authentication, abbreviated AuthN, which establishes identity; authorization, abbreviated AuthZ, which decides permitted actions; or ambiguous shorthand for either or both. The ambiguous use is a wording problem, not a third security operation.</desc>
  <rect width="800" height="350" rx="8" fill="#172235"/>
  <g fill="#24364e" stroke-width="1.5">
    <rect x="305" y="20" width="190" height="75" rx="6" stroke="#fbbf24"/>
    <rect x="30" y="150" width="190" height="100" rx="6" stroke="#60a5fa"/>
    <rect x="305" y="150" width="190" height="100" rx="6" stroke="#5eead4"/>
    <rect x="580" y="150" width="190" height="100" rx="6" stroke="#c4b5fd"/>
  </g>
  <g stroke="#bdc8d8" stroke-width="2" fill="none">
    <path d="M400 96V123H125V148M400 123V148M400 123H675V148"/>
    <path d="M125 148L118 139M125 148L132 139M400 148L393 139M400 148L407 139M675 148L668 139M675 148L682 139"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g fill="#f3f4f6">
      <text x="400" y="53" font-size="24" font-weight="600">Auth</text>
      <text x="125" y="186" font-size="24" font-weight="600">AuthN</text>
      <text x="400" y="186" font-size="24" font-weight="600">AuthZ</text>
      <text x="675" y="184" font-size="19" font-weight="600">Ambiguous</text>
    </g>
    <g fill="#bdc8d8" font-size="16">
      <text x="400" y="79">Clarify the scope</text>
      <text x="125" y="212">Authentication</text>
      <text x="125" y="235">Establish identity</text>
      <text x="400" y="212">Authorization</text>
      <text x="400" y="235">Decide access</text>
      <text x="675" y="211">Either or both</text>
      <text x="675" y="234">Specify what is meant</text>
      <text x="400" y="308">Say AuthN or AuthZ: bare “auth” leaves the scope unclear.</text>
    </g>
  </g>
</svg>
