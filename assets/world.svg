<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc"><title id="title">Definition, runtime state, saved state, and control</title><desc id="desc">A catalog initializes a world. A world can be captured as a snapshot and restored from it. The operator manages the world.</desc><rect width="800" height="350" rx="8" fill="#172235"/>
