<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc"><title id="title">What can factory mean?</title><desc id="desc">Factory branches into an object factory that constructs configured instances, an AI software factory that produces verified software artifacts under this guide's working definition, and an AI infrastructure factory that supports AI workloads at scale.</desc><rect width="800" height="350" rx="8" fill="#172235"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="305" y="20" width="190" height="75" rx="6" fill="#24364e" stroke="#bdc8d8"/><rect x="30" y="150" width="224" height="100" rx="6" fill="#24364e" stroke="#60a5fa"/><rect x="288" y="150" width="224" height="100" rx="6" fill="#24364e" stroke="#5eead4"/><rect x="546" y="150" width="224" height="100" rx="6" fill="#24364e" stroke="#c4b5fd"/><g fill="#f3f4f6" font-size="24"><text x="400" y="53">Factory</text><text x="142" y="182">Object</text><text x="400" y="182">AI software</text><text x="658" y="182">AI infrastructure</text></g><g fill="#bdc8d8" font-size="16"><text x="400" y="79">What can it mean?</text><text x="142" y="210">Builds configured instances.</text><text x="142" y="232">An API client or agent.</text><text x="400" y="210">Produces verified software.</text><text x="400" y="232">This guide’s working meaning.</text><text x="658" y="210">Runs AI workloads at scale.</text><text x="658" y="232">Compute, network, software.</text><text x="400" y="309">In this guide, “factory” means the AI software factory.</text></g></g><g stroke="#bdc8d8" stroke-width="2" fill="none"><path d="M400 97V120M142 120H658M142 120V142L135 133M142 142L149 133M400 120V142L393 133M400 142L407 133M658 120V142L651 133M658 142L665 133"/></g></svg>
