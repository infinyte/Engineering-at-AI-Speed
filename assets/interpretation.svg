<svg xmlns="http://www.w3.org/2000/svg" width="580" height="470" viewBox="0 0 580 470" role="img" aria-labelledby="title desc">
<title id="title">One request, two architectures</title><desc id="desc">Build a global product registry can be interpreted as a searchable catalog or an authoritative registry. Both interpretations can generate reasonable code.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#90a4c0"/></marker></defs>
<rect x="1" y="1" width="578" height="468" rx="12" fill="#172235" stroke="#35445a"/>
<text x="290" y="47" text-anchor="middle" fill="#bdc8d8" font-family="Segoe UI,Arial,sans-serif" font-size="16">One request. Two interpretations.</text>
<rect x="58" y="75" width="464" height="75" rx="6" fill="#26364e" stroke="#61748e"/><text x="290" y="106" text-anchor="middle" fill="#f3f4f6" font-family="Georgia,serif" font-size="21">“Build a global</text><text x="290" y="133" text-anchor="middle" fill="#f3f4f6" font-family="Georgia,serif" font-size="21">product registry.”</text>
<path d="M290 150V188H155V228" fill="none" stroke="#90a4c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M290 188H425V228" fill="none" stroke="#90a4c0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="237" width="255" height="155" rx="6" fill="#1c3048" stroke="#60a5fa"/><rect x="300" y="237" width="255" height="155" rx="6" fill="#303027" stroke="#fbbf24"/>
<text x="152" y="271" text-anchor="middle" fill="#91c3ff" font-family="Georgia,serif" font-size="22">Searchable catalog</text><text x="425" y="271" text-anchor="middle" fill="#fbbf24" font-family="Georgia,serif" font-size="22">Identity registry</text>
<g fill="#d6deeb" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle"><text x="152" y="306">Source listings</text><text x="152" y="333">Search and classification</text><text x="152" y="360">Observation timestamps</text><text x="425" y="306">Canonical identities</text><text x="425" y="333">Registration and ownership</text><text x="425" y="360">Conflict resolution</text></g>
<text x="290" y="435" text-anchor="middle" fill="#bdc8d8" font-family="Segoe UI,Arial,sans-serif" font-size="16">Reasonable code. Different systems.</text></svg>
